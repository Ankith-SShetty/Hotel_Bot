<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Come and Stay Hotel - Chat</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .header {
            color: white;
            text-align: center;
            margin-bottom: 1rem;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
        }
        .header p {
            margin: 0.25rem 0 0 0;
            opacity: 0.9;
        }
        #webchat {
            width: 90vw;
            max-width: 500px;
            height: 75vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        /* Optional: adjust webchat bubble colors */
        .rw-conversation-container .rw-message.rw-client {
            background: #667eea;
            color: white;
        }
        .rw-conversation-container .rw-message.rw-response {
            background: #f1f3f5;
            color: #333;
        }
        .rw-conversation-container .rw-send-button {
            background: #667eea;
        }
        .rw-conversation-container .rw-send-button:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Come and Stay Hotel</h1>
        <p>How can I help you today?</p>
    </div>
    <div id="webchat"></div>
    <script src="https://unpkg.com/rasa-webchat@0.11.5/lib/index.js"></script>
    <script>
        window.onload = function() {
            console.error('Skipping WebChat; using REST-only fallback.');
            document.getElementById('webchat').innerHTML = `
                <div id="fallback-chat" style="height:100%;display:flex;flex-direction:column;">
                    <div id="messages" style="flex:1;overflow-y:auto;padding:1rem;background:#f1f3f5;"></div>
                    <div style="padding:0.75rem;background:white;border-top:1px solid #dee2e6;">
                        <input type="text" id="userInput" placeholder="Type your message..." style="width:70%;padding:0.5rem;border:1px solid #ced4da;border-radius:4px;">
                        <button onclick="sendMessage()" style="width:25%;padding:0.5rem;background:#667eea;color:white;border:none;border-radius:4px;cursor:pointer;">Send</button>
                    </div>
                </div>
            `;
            const botUrl = `http://localhost:5005/webhooks/rest/webhook`;

            async function sendMessage() {
                const input = document.getElementById('userInput');
                const userText = input.value.trim();
                if (!userText) return;
                const messages = document.getElementById('messages');
                messages.innerHTML += `<div style="margin:0.5rem 0;"><strong>You:</strong> ${userText}</div>`;
                input.value = '';
                try {
                    const r = await fetch(botUrl, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({sender: 'user', message: userText})
                    });
                    const data = await r.json();
                    data.forEach(msg => {
                        messages.innerHTML += `<div style="margin:0.5rem 0;white-space:pre-wrap;"><strong>Bot:</strong> ${msg.text}</div>`;
                    });
                    messages.scrollTop = messages.scrollHeight;
                } catch (e) {
                    messages.innerHTML += `<div style="margin:0.5rem 0;color:red;"><strong>Error:</strong> Could not reach bot.</div>`;
                }
            }
            document.getElementById('userInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
            // Greet on load
            (async () => {
                try {
                    const r = await fetch(botUrl, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({sender: 'user', message: '/greet'})
                    });
                    const data = await r.json();
                    const messages = document.getElementById('messages');
                    data.forEach(msg => {
                        messages.innerHTML += `<div style="margin:0.5rem 0;white-space:pre-wrap;"><strong>Bot:</strong> ${msg.text}</div>`;
                    });
                } catch (e) {
                    console.error('Greet failed', e);
                }
            })();
        };
    </script>
</body>
</html>
